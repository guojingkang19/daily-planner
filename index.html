<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><meta name="theme-color" content="#5B7FFF"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>日程助手</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"><div id="home-view" class="view active"><div id="home-header"><button id="calendar-btn">📅</button></div><div id="home-scroll"><div id="today-card"><div id="today-star">★</div><div id="today-date"></div><div id="today-sub"></div><div id="today-count"></div><div id="today-en">today</div></div><div id="home-cards"><div id="future-card" class="nav-card"><div class="nav-title">未来计划</div><div class="nav-desc"></div><div class="nav-en" id="future-en">future</div></div><div id="past-card" class="nav-card"><div class="nav-title">过去计划</div><div class="nav-desc"></div><div class="nav-en" id="past-en">past</div></div></div></div></div><div id="list-view" class="view"><div id="list-header"><button id="list-back">&lsaquo;</button><span id="list-title"></span></div><div id="list-date-list"></div><button id="list-add-btn" aria-label="添加日期">+</button></div><div id="detail-view" class="view"><div id="detail-header"><button id="back-btn">&lsaquo;</button><div id="detail-header-info"><span id="detail-date-title"></span><span id="detail-date-sub"></span></div></div><div id="task-list"></div><div id="add-task-bar"><input id="add-input" placeholder="添加计划…" type="text" autocomplete="off"><button id="add-btn">+</button></div></div><div id="cal-modal" class="modal hidden"><div class="modal-overlay"></div><div class="modal-panel"><div id="cal-header"><button id="cal-prev"><</button><span id="cal-title"></span><button id="cal-next">></button></div><div id="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="cal-grid"></div><button id="cal-today" class="cal-today-btn">回到今天</button></div></div><div id="reminder-modal" class="modal hidden"><div class="modal-overlay"></div><div class="modal-panel modal-sm"><h3 class="modal-title">设置提醒时间</h3><input type="time" id="reminder-input" class="modal-input"><div class="modal-actions"><button id="reminder-cancel" class="btn-sec">取消</button><button id="reminder-confirm" class="btn-pri">确认</button></div></div></div><div id="edit-modal" class="modal hidden"><div class="modal-overlay"></div><div class="modal-panel modal-sm"><h3 class="modal-title">修改计划</h3><input type="text" id="edit-input" class="modal-input" autocomplete="off"><div class="modal-actions"><button id="edit-cancel" class="btn-sec">取消</button><button id="edit-confirm" class="btn-pri">保存</button></div></div></div></div><script src="js/db.js"></script><script src="js/gestures.js"></script><script src="js/app.js"></script></body></html>
